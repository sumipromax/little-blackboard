<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分数除法 · 补充阅读</title><style>body{font:16px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#303238;max-width:720px;margin:64px auto;padding:0 24px}h1{font-size:28px}h2{font-size:20px}small{color:#858a94}.example{background:#f0f4ff;padding:24px;border-radius:4px}a{color:#3f76fc}</style><small>小黑板 · 本地演练资料</small><h1>一杯水，为什么能说明分数除法？</h1><p>先想一个普通问题：一杯水，倒进容量为四分之一杯的小杯里，可以装满几杯？</p><div class="example">每小杯是 ¼ 杯。<br>¼ + ¼ + ¼ + ¼ = 1<br>所以一杯水能装满 4 小杯：1 ÷ ¼ = 4</div><h2>“除以”是在问什么？</h2><p>在这个例子里，除法是在问：总量中包含多少份？每份越小，可以分出的份数就越多。</p><h2>再试一个例子</h2><p>半杯水能装满几个四分之一杯？答案是两杯。因为半杯里有两个四分之一杯：½ ÷ ¼ = 2。</p><p>这些例子帮助理解分数除法的含义。推广到一般的分数除法，还需要结合课程里的完整推导。</p><small>这是固定演练材料，不代表真实素材库检索结果</small></html>
